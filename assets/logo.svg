<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 56" role="img" aria-label="Sieker Friseur Logo">
  <title>Sieker Friseur</title>
  <!-- Scissors icon -->
  <g transform="translate(4, 8)" fill="none" stroke="#F47F47" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="6"  cy="6"  r="3"/>
    <circle cx="6"  cy="30" r="3"/>
    <line x1="8.8"  y1="8.2"  x2="30" y2="26"/>
    <line x1="8.8"  y1="27.8" x2="30" y2="10"/>
    <line x1="30"   y1="10"   x2="36" y2="10"/>
    <line x1="30"   y1="26"   x2="36" y2="26"/>
  </g>
  <!-- Wordmark -->
